apiVersion: apps/v1
kind: Deployment
metadata:
  labels:
    app: example-deploy
  name: example-deploy
spec:
  replicas: 1
  selector:
    matchLabels:
      app: example-deploy
  strategy: {}
  template:
    metadata:
      labels:
        app: example-deploy
    spec:
      containers:
      - image: nginx:latest
        name: nginx
        resources: {}
status: {}
