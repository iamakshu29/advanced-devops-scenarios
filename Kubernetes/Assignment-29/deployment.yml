apiVersion: apps/v1
kind: Deployment
metadata:
  labels:
    app: rolling-restart-zero-downtime
  name: rolling-restart-zero-downtime
spec:
  replicas: 3
  selector:
    matchLabels:
      app: rolling-restart-zero-downtime
  strategy:
    # Rolling update strategy ensures zero downtime during updates
    type: RollingUpdate
    rollingUpdate:
      maxUnavailable: 0
      maxSurge: 1
  template:
    metadata:
      labels:
        app: rolling-restart-zero-downtime
    spec:
      containers:
      - image: nginx:1.29.1
        name: nginx
        resources: {}
