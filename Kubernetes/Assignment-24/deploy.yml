apiVersion: apps/v1
kind: Deployment
metadata:
  labels:
    app: auto-rollback-deploy
  name: auto-rollback-deploy
spec:
  replicas: 3
  selector:
    matchLabels:
      app: auto-rollback-deploy
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxUnavailable: 0
      maxSurge: 1
  template:
    metadata:
      labels:
        app: auto-rollback-deploy
    spec:
      containers:
      - image: nginx:latest
        name: nginx
        livenessProbe:
          httpGet:
            path: /
            port: 80
          initialDelaySeconds: 5
          periodSeconds: 5
          failureThreshold: 3
        readinessProbe:
          httpGet:
            path: /
            port: 80
          initialDelaySeconds: 3
          periodSeconds: 3
          failureThreshold: 3
        resources: {}
