apiVersion: v1
kind: Pod
metadata:
  labels:
    run: zero-downtime-check
  name: zero-downtime-check
spec:
  containers:
  - image: busybox
    name: zero-downtime-check
    command:
    - sh
    - -c
    - |
      while true
      do
        wget -qO- http://rolling-restart-zero-downtime-deploy >/dev/null && echo "OK" || echo "FAILED"
        sleep 0.1
      done
    resources: {}
  dnsPolicy: ClusterFirst
  restartPolicy: Always
status: {}
